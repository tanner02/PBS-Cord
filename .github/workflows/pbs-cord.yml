name: PBS Cord

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_ps5:
        description: Build the Discord streaming ELF with a compatible payload SDK
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  host:
    name: Streaming-only regressions
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build pkg-config libssl-dev libsodium-dev libopus-dev nlohmann-json3-dev python3 ffmpeg nodejs
      - name: Build and test the Discord integration
        run: |
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host --parallel 2
          ctest --test-dir build-host --output-on-failure --parallel 2
      - name: Check embedded dashboard and player recovery
        run: |
          python3 -m unittest discover -s tests -p test_embed_assets.py
          node tests/ps5/test_dashboard_recovery.js
          node tests/ps5/test_dashboard_recovery.js --managed
          node tests/ps5/test_videojs_audio.js

  ps5:
    name: Discord streaming payload
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ps5 }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install cross-build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build clang lld llvm perl pkg-config python3 git curl
      - name: Payload SDK
        uses: ./.github/actions/payload-sdk
        with:
          platform: ps5
          url: ${{ vars.PS5_PAYLOAD_SDK_URL }}
          repo: ${{ vars.PS5_PAYLOAD_SDK_REPO }}
          ref: ${{ vars.PS5_PAYLOAD_SDK_REF }}
      - name: Build PBS Cord
        run: |
          bash scripts/build-ps5-deps.sh
          cmake -S . -B build-ps5 -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/ps5.cmake -DCMAKE_BUILD_TYPE=Release -DPBSD_BUILD_TESTS=OFF
          cmake --build build-ps5 --parallel 2
          sha256sum build-ps5/pbs-discord.elf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PBS-Cord-PS5
          path: build-ps5/pbs-discord.elf
          if-no-files-found: error
