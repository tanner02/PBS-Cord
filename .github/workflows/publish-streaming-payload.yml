name: Publish streaming-only payload

on:
  push:
    branches: [master]
    paths:
      - releases/streaming-2026-11-20/**
      - .github/workflows/publish-streaming-payload.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the reviewed prebuilt ELF
        working-directory: releases/streaming-2026-11-20
        run: |
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          data = Path('pbs-discord.elf').read_bytes()
          info = json.loads(Path('BUILD-INFO.json').read_text())
          assert data[:4] == b'\x7fELF'
          assert info['source_commit'] == '5d8c17a04c098850c7f2b58a86ed34ab53f1fedc'
          assert info['sha256'] == 'b8514e4c6660be33af6b7146005331179d845bd0abf6a64dd0af5d452c6eaaa8'
          assert hashlib.sha256(data).hexdigest() == info['sha256']
          assert len(data) == info['bytes']
          assert info['experimental_voice_chat'] is False
          PY
      - name: Publish the streaming-only release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload streaming-2026-11-20 --clobber \
            releases/streaming-2026-11-20/pbs-discord.elf \
            releases/streaming-2026-11-20/SHA256SUMS \
            releases/streaming-2026-11-20/BUILD-INFO.json
          gh release edit streaming-2026-11-20 --notes-file releases/streaming-2026-11-20/README.md
